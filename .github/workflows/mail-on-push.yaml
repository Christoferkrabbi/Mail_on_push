on: 
  push:
    branches:
      - main
      - master
jobs:
  mail-on-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send email on push
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "New Push to Repository ${{github.repository}}"
          from: "christoferkrabbi@gmail.com"
          body: "A new push has been made to the ${{github.repository}} repository by ${{github.event.pusher.name}}. Commit message: ${{github.event.head_commit.message}}"
          to: christoferkrabbi@gmail.com